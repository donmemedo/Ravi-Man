services:
  backend:
    build: ./backend
    ports: ["8131:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    ports: ["3131:3000"]
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
